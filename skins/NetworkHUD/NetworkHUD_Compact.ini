[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=0,0,0,1
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Network HUD (Compact)
Author=Ryan Boe
Version=1.0
License=Creative Commons BY-NC-SA 3.0
Information=Cyberpunk-style WiFi signal + network speed HUD. Shrunk to 80% linear scale for a slightly smaller, still-readable footprint.

[Variables]
Margin=8
PW=256
PH=260.8
PadX=22.4

; ---- Colors ----
BgClr=8,10,16,235
NeonCyan=0,255,255,255
NeonCyanDim=0,255,255,60
NeonMagenta=255,0,170,255
NeonMagentaDim=255,0,170,60
TextClr=210,255,255,255
DimTextClr=120,180,190,255
FontFace=Consolas

;=====================================================
;  Measures
;=====================================================
[MeasureSSID]
Measure=Plugin
Plugin=WifiStatus
WifiInfoType=SSID
RegExpSubstitute=1
Substitute="^-1$":"NO CONNECTION","^$":"NO CONNECTION"

[MeasureQuality]
Measure=Plugin
Plugin=WifiStatus
WifiInfoType=Quality
MinValue=0
MaxValue=100

[MeasureNetIn]
Measure=NetIn
Interface=Best

[MeasureNetOut]
Measure=NetOut
Interface=Best

;=====================================================
;  Panel (chamfered HUD frame, dividers, corner brackets)
;=====================================================
[Panel]
Meter=Shape
X=#Margin#
Y=#Margin#
Shape=Path PanelPath | StrokeWidth 1 | Stroke Color #NeonCyan# | Fill Color #BgClr#
PanelPath=11.2,0 | LineTo 244.8,0 | LineTo 256,11.2 | LineTo 256,249.6 | LineTo 244.8,260.8 | LineTo 11.2,260.8 | LineTo 0,249.6 | LineTo 0,11.2 | ClosePath 1
Shape2=Line 11.2,51.2,244.8,51.2 | StrokeColor #NeonCyanDim# | StrokeWidth 1
Shape3=Line 11.2,99.2,244.8,99.2 | StrokeColor #NeonCyanDim# | StrokeWidth 1
Shape4=Line 11.2,176.8,244.8,176.8 | StrokeColor #NeonCyanDim# | StrokeWidth 1
Shape5=Path CornerTL | StrokeWidth 1.6 | Stroke Color #NeonCyan#
CornerTL=4.8,17.6 | LineTo 4.8,4.8 | LineTo 17.6,4.8
Shape6=Path CornerTR | StrokeWidth 1.6 | Stroke Color #NeonCyan#
CornerTR=238.4,4.8 | LineTo 251.2,4.8 | LineTo 251.2,17.6
Shape7=Path CornerBL | StrokeWidth 1.6 | Stroke Color #NeonCyan#
CornerBL=4.8,243.2 | LineTo 4.8,256 | LineTo 17.6,256
Shape8=Path CornerBR | StrokeWidth 1.6 | Stroke Color #NeonCyan#
CornerBR=238.4,256 | LineTo 251.2,256 | LineTo 251.2,243.2

;=====================================================
;  Header
;=====================================================
[Title]
Meter=String
MeasureName=MeasureSSID
X=30.4
Y=25.6
FontFace=#FontFace#
FontSize=10.5
FontColor=#NeonCyan#
StringStyle=Bold
AntiAlias=1
Text="// NETWORK_HUD"

[SSIDLabel]
Meter=String
MeasureName=MeasureSSID
X=30.4
Y=43.2
FontFace=#FontFace#
FontSize=7.5
FontColor=#DimTextClr#
AntiAlias=1
Text="SSID: %1"

;=====================================================
;  WiFi Signal
;=====================================================
[SignalLabel]
Meter=String
MeasureName=MeasureQuality
X=30.4
Y=70.4
FontFace=#FontFace#
FontSize=8
FontColor=#TextClr#
AntiAlias=1
NumOfDecimals=0
Text="SIGNAL   %1%"

[SignalBarTrack]
Meter=Bar
MeasureName=MeasureQuality
BarOrientation=HORIZONTAL
X=30.4
Y=88
W=211.2
H=11.2
BarColor=#NeonCyan#
SolidColor=0,255,255,25

[SignalBarTicks]
Meter=Shape
X=30.4
Y=88
Shape=Line 42.24,0,42.24,11.2 | StrokeColor #BgClr# | StrokeWidth 1.6
Shape2=Line 84.48,0,84.48,11.2 | StrokeColor #BgClr# | StrokeWidth 1.6
Shape3=Line 126.72,0,126.72,11.2 | StrokeColor #BgClr# | StrokeWidth 1.6
Shape4=Line 168.96,0,168.96,11.2 | StrokeColor #BgClr# | StrokeWidth 1.6

;=====================================================
;  Download
;=====================================================
[DownLabel]
Meter=String
MeasureName=MeasureNetIn
X=30.4
Y=118.4
FontFace=#FontFace#
FontSize=8
FontColor=#NeonCyan#
AntiAlias=1
AutoScale=1
Text="▼ DOWN   %1B/s"

[DownGraph]
Meter=Line
MeasureName=MeasureNetIn
X=30.4
Y=134.4
W=211.2
H=44
LineColor=#NeonCyan#
LineWidth=1.6
AutoScale=1
AntiAlias=1

;=====================================================
;  Upload
;=====================================================
[UpLabel]
Meter=String
MeasureName=MeasureNetOut
X=30.4
Y=196
FontFace=#FontFace#
FontSize=8
FontColor=#NeonMagenta#
AntiAlias=1
AutoScale=1
Text="▲ UP   %1B/s"

[UpGraph]
Meter=Line
MeasureName=MeasureNetOut
X=30.4
Y=212
W=211.2
H=44
LineColor=#NeonMagenta#
LineWidth=1.6
AutoScale=1
AntiAlias=1
