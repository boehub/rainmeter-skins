[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=0,0,0,1
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Network HUD
Author=Ryan Boe
Version=1.0
License=Creative Commons BY-NC-SA 3.0
Information=Cyberpunk-style WiFi signal + network speed HUD.

[Variables]
Margin=10
PW=320
PH=326
PadX=28

; ---- Colors ----
BgClr=8,10,16,235
NeonCyan=0,255,255,255
NeonCyanDim=0,255,255,60
NeonMagenta=255,0,170,255
NeonMagentaDim=255,0,170,60
TextClr=210,255,255,255
DimTextClr=120,180,190,255
FontFace=Consolas

;=====================================================
;  Measures
;=====================================================
[MeasureSSID]
Measure=Plugin
Plugin=WifiStatus
WifiInfoType=SSID
RegExpSubstitute=1
Substitute="^-1$":"NO CONNECTION","^$":"NO CONNECTION"

[MeasureQuality]
Measure=Plugin
Plugin=WifiStatus
WifiInfoType=Quality
MinValue=0
MaxValue=100

[MeasureNetIn]
Measure=NetIn
Interface=Best

[MeasureNetOut]
Measure=NetOut
Interface=Best

;=====================================================
;  Panel (chamfered HUD frame, dividers, corner brackets)
;=====================================================
[Panel]
Meter=Shape
X=#Margin#
Y=#Margin#
Shape=Path PanelPath | StrokeWidth 1 | Stroke Color #NeonCyan# | Fill Color #BgClr#
PanelPath=14,0 | LineTo 306,0 | LineTo 320,14 | LineTo 320,312 | LineTo 306,326 | LineTo 14,326 | LineTo 0,312 | LineTo 0,14 | ClosePath 1
Shape2=Line 14,64,306,64 | StrokeColor #NeonCyanDim# | StrokeWidth 1
Shape3=Line 14,124,306,124 | StrokeColor #NeonCyanDim# | StrokeWidth 1
Shape4=Line 14,221,306,221 | StrokeColor #NeonCyanDim# | StrokeWidth 1
Shape5=Path CornerTL | StrokeWidth 2 | Stroke Color #NeonCyan#
CornerTL=6,22 | LineTo 6,6 | LineTo 22,6
Shape6=Path CornerTR | StrokeWidth 2 | Stroke Color #NeonCyan#
CornerTR=298,6 | LineTo 314,6 | LineTo 314,22
Shape7=Path CornerBL | StrokeWidth 2 | Stroke Color #NeonCyan#
CornerBL=6,304 | LineTo 6,320 | LineTo 22,320
Shape8=Path CornerBR | StrokeWidth 2 | Stroke Color #NeonCyan#
CornerBR=298,320 | LineTo 314,320 | LineTo 314,304

;=====================================================
;  Header
;=====================================================
[Title]
Meter=String
MeasureName=MeasureSSID
X=38
Y=32
FontFace=#FontFace#
FontSize=13
FontColor=#NeonCyan#
StringStyle=Bold
AntiAlias=1
Text="// NETWORK_HUD"

[SSIDLabel]
Meter=String
MeasureName=MeasureSSID
X=38
Y=54
FontFace=#FontFace#
FontSize=9
FontColor=#DimTextClr#
AntiAlias=1
Text="SSID: %1"

;=====================================================
;  WiFi Signal
;=====================================================
[SignalLabel]
Meter=String
MeasureName=MeasureQuality
X=38
Y=88
FontFace=#FontFace#
FontSize=10
FontColor=#TextClr#
AntiAlias=1
NumOfDecimals=0
Text="SIGNAL   %1%"

[SignalBarTrack]
Meter=Bar
MeasureName=MeasureQuality
BarOrientation=HORIZONTAL
X=38
Y=110
W=264
H=14
BarColor=#NeonCyan#
SolidColor=0,255,255,25

[SignalBarTicks]
Meter=Shape
X=38
Y=110
Shape=Line 52.8,0,52.8,14 | StrokeColor #BgClr# | StrokeWidth 2
Shape2=Line 105.6,0,105.6,14 | StrokeColor #BgClr# | StrokeWidth 2
Shape3=Line 158.4,0,158.4,14 | StrokeColor #BgClr# | StrokeWidth 2
Shape4=Line 211.2,0,211.2,14 | StrokeColor #BgClr# | StrokeWidth 2

;=====================================================
;  Download
;=====================================================
[DownLabel]
Meter=String
MeasureName=MeasureNetIn
X=38
Y=148
FontFace=#FontFace#
FontSize=10
FontColor=#NeonCyan#
AntiAlias=1
AutoScale=1
Text="▼ DOWN   %1B/s"

[DownGraph]
Meter=Line
MeasureName=MeasureNetIn
X=38
Y=168
W=264
H=55
LineColor=#NeonCyan#
LineWidth=2
AutoScale=1
AntiAlias=1

;=====================================================
;  Upload
;=====================================================
[UpLabel]
Meter=String
MeasureName=MeasureNetOut
X=38
Y=245
FontFace=#FontFace#
FontSize=10
FontColor=#NeonMagenta#
AntiAlias=1
AutoScale=1
Text="▲ UP   %1B/s"

[UpGraph]
Meter=Line
MeasureName=MeasureNetOut
X=38
Y=265
W=264
H=55
LineColor=#NeonMagenta#
LineWidth=2
AutoScale=1
AntiAlias=1
