;===================================================================
; Tesseract - Rainmeter Skin
; A rotating 4D hypercube (tesseract), drawn live using Rainmeter's
; built-in Lua scripting + Shape meter. No plugins, no other software
; required - just Rainmeter itself.
;
; The tesseract has 16 vertices and 32 edges. The 24 edges that form
; the "inner cube" and "outer cube" are drawn in EdgeColor; the 8
; edges connecting the inner cube to the outer cube (i.e. the ones
; that only exist because of the 4th dimension) are drawn in
; EdgeColorW, so the classic nested-cube tesseract shape is easy to
; pick out.
;
; Tweak speed/size/perspective in tesseract.lua. Tweak colors below.
;===================================================================

[Rainmeter]
Update=33
DynamicWindowSize=1
AccurateText=1

[Metadata]
Name=Tesseract
Author=Ryan Boe
Version=1.0
Description=A rotating 4D hypercube (tesseract), drawn with Lua + Shape meter

[Variables]
BGColor=20,20,20,190
EdgeColor=120,200,255,255
EdgeColorW=255,150,90,255
EdgeWidth=2

;===================== MEASURE =====================

[MeasureTesseract]
Measure=Script
ScriptFile=tesseract.lua

;===================== METERS =====================

[Background]
Meter=Image
X=0
Y=0
W=180
H=180
SolidColor=#BGColor#

; 32 edges total. First 24 (three groups of 8) are the "inner cube" and
; "outer cube" edges. Last 8 are the W-axis edges connecting the two,
; drawn in a contrasting color.
[TesseractEdges]
Meter=Shape
; --- edges varying only in x (bit 1) ---
Shape=Line   [&MeasureTesseract:GetX(1)],[&MeasureTesseract:GetY(1)],[&MeasureTesseract:GetX(2)],[&MeasureTesseract:GetY(2)]   | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
Shape2=Line  [&MeasureTesseract:GetX(3)],[&MeasureTesseract:GetY(3)],[&MeasureTesseract:GetX(4)],[&MeasureTesseract:GetY(4)]   | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
Shape3=Line  [&MeasureTesseract:GetX(5)],[&MeasureTesseract:GetY(5)],[&MeasureTesseract:GetX(6)],[&MeasureTesseract:GetY(6)]   | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
Shape4=Line  [&MeasureTesseract:GetX(7)],[&MeasureTesseract:GetY(7)],[&MeasureTesseract:GetX(8)],[&MeasureTesseract:GetY(8)]   | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
Shape5=Line  [&MeasureTesseract:GetX(9)],[&MeasureTesseract:GetY(9)],[&MeasureTesseract:GetX(10)],[&MeasureTesseract:GetY(10)] | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
Shape6=Line  [&MeasureTesseract:GetX(11)],[&MeasureTesseract:GetY(11)],[&MeasureTesseract:GetX(12)],[&MeasureTesseract:GetY(12)] | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
Shape7=Line  [&MeasureTesseract:GetX(13)],[&MeasureTesseract:GetY(13)],[&MeasureTesseract:GetX(14)],[&MeasureTesseract:GetY(14)] | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
Shape8=Line  [&MeasureTesseract:GetX(15)],[&MeasureTesseract:GetY(15)],[&MeasureTesseract:GetX(16)],[&MeasureTesseract:GetY(16)] | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
; --- edges varying only in y (bit 2) ---
Shape9=Line  [&MeasureTesseract:GetX(1)],[&MeasureTesseract:GetY(1)],[&MeasureTesseract:GetX(3)],[&MeasureTesseract:GetY(3)]   | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
Shape10=Line [&MeasureTesseract:GetX(2)],[&MeasureTesseract:GetY(2)],[&MeasureTesseract:GetX(4)],[&MeasureTesseract:GetY(4)]   | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
Shape11=Line [&MeasureTesseract:GetX(5)],[&MeasureTesseract:GetY(5)],[&MeasureTesseract:GetX(7)],[&MeasureTesseract:GetY(7)]   | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
Shape12=Line [&MeasureTesseract:GetX(6)],[&MeasureTesseract:GetY(6)],[&MeasureTesseract:GetX(8)],[&MeasureTesseract:GetY(8)]   | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
Shape13=Line [&MeasureTesseract:GetX(9)],[&MeasureTesseract:GetY(9)],[&MeasureTesseract:GetX(11)],[&MeasureTesseract:GetY(11)] | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
Shape14=Line [&MeasureTesseract:GetX(10)],[&MeasureTesseract:GetY(10)],[&MeasureTesseract:GetX(12)],[&MeasureTesseract:GetY(12)] | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
Shape15=Line [&MeasureTesseract:GetX(13)],[&MeasureTesseract:GetY(13)],[&MeasureTesseract:GetX(15)],[&MeasureTesseract:GetY(15)] | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
Shape16=Line [&MeasureTesseract:GetX(14)],[&MeasureTesseract:GetY(14)],[&MeasureTesseract:GetX(16)],[&MeasureTesseract:GetY(16)] | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
; --- edges varying only in z (bit 4) ---
Shape17=Line [&MeasureTesseract:GetX(1)],[&MeasureTesseract:GetY(1)],[&MeasureTesseract:GetX(5)],[&MeasureTesseract:GetY(5)]   | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
Shape18=Line [&MeasureTesseract:GetX(2)],[&MeasureTesseract:GetY(2)],[&MeasureTesseract:GetX(6)],[&MeasureTesseract:GetY(6)]   | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
Shape19=Line [&MeasureTesseract:GetX(3)],[&MeasureTesseract:GetY(3)],[&MeasureTesseract:GetX(7)],[&MeasureTesseract:GetY(7)]   | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
Shape20=Line [&MeasureTesseract:GetX(4)],[&MeasureTesseract:GetY(4)],[&MeasureTesseract:GetX(8)],[&MeasureTesseract:GetY(8)]   | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
Shape21=Line [&MeasureTesseract:GetX(9)],[&MeasureTesseract:GetY(9)],[&MeasureTesseract:GetX(13)],[&MeasureTesseract:GetY(13)] | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
Shape22=Line [&MeasureTesseract:GetX(10)],[&MeasureTesseract:GetY(10)],[&MeasureTesseract:GetX(14)],[&MeasureTesseract:GetY(14)] | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
Shape23=Line [&MeasureTesseract:GetX(11)],[&MeasureTesseract:GetY(11)],[&MeasureTesseract:GetX(15)],[&MeasureTesseract:GetY(15)] | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
Shape24=Line [&MeasureTesseract:GetX(12)],[&MeasureTesseract:GetY(12)],[&MeasureTesseract:GetX(16)],[&MeasureTesseract:GetY(16)] | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
; --- edges varying only in w (bit 8) - the "4th dimension" connectors ---
Shape25=Line [&MeasureTesseract:GetX(1)],[&MeasureTesseract:GetY(1)],[&MeasureTesseract:GetX(9)],[&MeasureTesseract:GetY(9)]   | StrokeColor #EdgeColorW# | StrokeWidth #EdgeWidth#
Shape26=Line [&MeasureTesseract:GetX(2)],[&MeasureTesseract:GetY(2)],[&MeasureTesseract:GetX(10)],[&MeasureTesseract:GetY(10)] | StrokeColor #EdgeColorW# | StrokeWidth #EdgeWidth#
Shape27=Line [&MeasureTesseract:GetX(3)],[&MeasureTesseract:GetY(3)],[&MeasureTesseract:GetX(11)],[&MeasureTesseract:GetY(11)] | StrokeColor #EdgeColorW# | StrokeWidth #EdgeWidth#
Shape28=Line [&MeasureTesseract:GetX(4)],[&MeasureTesseract:GetY(4)],[&MeasureTesseract:GetX(12)],[&MeasureTesseract:GetY(12)] | StrokeColor #EdgeColorW# | StrokeWidth #EdgeWidth#
Shape29=Line [&MeasureTesseract:GetX(5)],[&MeasureTesseract:GetY(5)],[&MeasureTesseract:GetX(13)],[&MeasureTesseract:GetY(13)] | StrokeColor #EdgeColorW# | StrokeWidth #EdgeWidth#
Shape30=Line [&MeasureTesseract:GetX(6)],[&MeasureTesseract:GetY(6)],[&MeasureTesseract:GetX(14)],[&MeasureTesseract:GetY(14)] | StrokeColor #EdgeColorW# | StrokeWidth #EdgeWidth#
Shape31=Line [&MeasureTesseract:GetX(7)],[&MeasureTesseract:GetY(7)],[&MeasureTesseract:GetX(15)],[&MeasureTesseract:GetY(15)] | StrokeColor #EdgeColorW# | StrokeWidth #EdgeWidth#
Shape32=Line [&MeasureTesseract:GetX(8)],[&MeasureTesseract:GetY(8)],[&MeasureTesseract:GetX(16)],[&MeasureTesseract:GetY(16)] | StrokeColor #EdgeColorW# | StrokeWidth #EdgeWidth#
DynamicVariables=1
X=0
Y=0
