;===================================================================
; PerfMonitor - Rainmeter Skin (Cyberpunk Edition v5 - compact)
; Built for: HP ENVY x360 15m-ee0xxx / AMD Ryzen 5 4500U (integrated Radeon)
;
; Same compact single-panel layout as the original PerfMonitor - just
; reskinned with a neon HUD grid background, glowing border + corner
; brackets, and a cyberpunk color palette (cyan/magenta/green/amber/
; purple per section). No gaps were added between sections; everything
; sits on one continuous panel like before.
;
; CPU/RAM/SWAP/Disk/Network usage are all NATIVE Rainmeter measures -
; these work immediately, no other software needed.
;
; CPU/GPU TEMPERATURE and GPU LOAD require LibreHardwareMonitor, because
; Windows does not expose real sensor data to Rainmeter on its own.
; If these show 0, it means LibreHardwareMonitor isn't running yet, or
; the plugin isn't in place - see setup notes below.
;
; SETUP FOR TEMP/GPU DATA:
; 1. Download LibreHardwareMonitor (no installer, just unzip):
;    https://github.com/LibreHardwareMonitor/LibreHardwareMonitor
; 2. Run LibreHardwareMonitor.exe (as Administrator if temps show blank)
;    and leave it running in the background/minimized.
; 3. Download the Rainmeter plugin (LibreHardwareMonitor.dll) from:
;    https://github.com/mallardduck/Rainmeter-LibreHardwareMonitor
;    (grab it from the Releases page - x64 build)
; 4. Copy LibreHardwareMonitor.dll into:
;    %appdata%\Rainmeter\Plugins
; 5. Reload this skin (right-click tray icon -> Refresh all).
;
; If a sensor name below doesn't match what your system reports, open
; LibreHardwareMonitor's own window, expand your CPU and GPU entries,
; and match the exact sensor label shown there to SensorName below.
;
; SIZE: back to the original W=200 / H=400 footprint. If it doesn't
; line up with the skin above it, change PanelW/GraphW in [Variables]
; (search-replace 200/180 with your target widths).
;===================================================================

[Rainmeter]
Update=1000
DynamicWindowSize=1
AccurateText=1

[Metadata]
Name=PerfMonitor
Author=Ryan Boe
Version=5.0
Description=CPU/RAM/Swap/Disk/Network natively + temps/GPU via LibreHardwareMonitor - Cyberpunk Edition (compact)

[Variables]
FontFace=Consolas
TextClr=210,255,255,255
DimTextClr=120,180,190,255
BGColor=8,10,16,235
GridClr=0,255,255,18
BorderClr=0,255,255,200

; ---- Neon accents per metric ----
CyanClr=0,255,255,255
MagentaClr=255,0,170,255
GreenClr=57,255,20,255
AmberClr=255,176,0,255
PurpleClr=170,0,255,255

; ---- Sizing (matches original layout) ----
PanelW=200
PanelH=400
GraphW=180
GraphH=28

;===================== MEASURES (native, no dependencies) =====================

[MeasureCPUUsage]
Measure=CPU

[MeasureRAMUsage]
Measure=PhysicalMemory

[MeasureSwapUsage]
Measure=SwapMemory

[MeasureDiskUsage]
Measure=FreeDiskSpace
Drive=C:
InvertMeasure=1

[MeasureNetIn]
Measure=NetIn
Interface=Best

[MeasureNetOut]
Measure=NetOut
Interface=Best

;===================== MEASURES (require LibreHardwareMonitor running) =====================

; NOTE: this plugin fetches data over HTTP from LibreHardwareMonitor's
; Remote Web Server (Options -> Remote Web Server -> Run, default port
; 8085). It must be enabled or these measures return -1. UpdateDivider=5
; below limits the HTTP polling to once every 5 seconds instead of every
; second, since polling too often over HTTP can bog Rainmeter down.
;
; NOTE ON THIS HARDWARE: the AMD Ryzen 5 4500U's integrated GPU has no
; separate Temperature sensor exposed via LibreHardwareMonitor (only
; Voltages/Clocks/Load/Data are reported for it). Since the CPU and GPU
; are on the same physical die, the GPU section below reuses the CPU
; temp reading instead of showing a permanent 0 or -1.

[MeasureCPUTemp]
Measure=Plugin
Plugin=LibreHardwareMonitor.dll
HardwareType=CPU
HardwareName=AMD Ryzen 5 4500U with Radeon Graphics
SensorType=Temperature
SensorName=Core (Tctl/Tdie)
UpdateDivider=5

[MeasureGPUUsage]
Measure=Plugin
Plugin=LibreHardwareMonitor.dll
HardwareType=GpuAmd
HardwareName=AMD Radeon(TM) Graphics
SensorType=Load
SensorName=GPU Core
UpdateDivider=5

