; ---- corner brackets ----
Shape31=Path CornerTL | StrokeWidth 2 | Stroke Color #BorderClr#
CornerTL=0,16 | LineTo 0,0 | LineTo 16,0
Shape32=Path CornerTR | StrokeWidth 2 | Stroke Color #BorderClr#
CornerTR=184,0 | LineTo 200,0 | LineTo 200,16
Shape33=Path CornerBL | StrokeWidth 2 | Stroke Color #BorderClr#
CornerBL=0,384 | LineTo 0,400 | LineTo 16,400
Shape34=Path CornerBR | StrokeWidth 2 | Stroke Color #BorderClr#
CornerBR=184,400 | LineTo 200,400 | LineTo 200,384
; ---- divider line under the title ----
Shape35=Line 10,20,190,20 | StrokeColor #CyanClr# | StrokeWidth 1

