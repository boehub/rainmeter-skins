[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=0,0,0,1
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Network HUD (Distance Compact)
Author=Ryan Boe
Version=1.1
License=Creative Commons BY-NC-SA 3.0
Information=Compact cyberpunk WiFi HUD with estimated distance (meters) to the connected router. Scaled to 85% linear size of the full Distance version.

[Variables]
Margin=8
PW=272
PH=326.4
PadX=23.8

; ---- Distance model tuning ----
; TxAt1m  = expected signal (dBm) at 1 meter from the router. Typical: -40 to -45.
; PathLoss = environment exponent. ~2.0 open space, 2.5-3.5 indoors with walls.
; Calibrate: stand ~1 m from your router, note the RSSI shown, set TxAt1m to it.
TxAt1m=-40
PathLoss=3.0
MaxDist=99

; ---- Colors ----
BgClr=8,10,16,235
NeonCyan=0,255,255,255
NeonCyanDim=0,255,255,60
NeonMagenta=255,0,170,255
NeonMagentaDim=255,0,170,60
TextClr=210,255,255,255
DimTextClr=120,180,190,255
FontFace=Consolas

;=====================================================
;  Measures
;=====================================================
[MeasureSSID]
Measure=Plugin
Plugin=WifiStatus
WifiInfoType=SSID
RegExpSubstitute=1
Substitute="^-1$":"NO CONNECTION","^$":"NO CONNECTION"

[MeasureQuality]
Measure=Plugin
Plugin=WifiStatus
WifiInfoType=Quality
MinValue=0
MaxValue=100

; Windows reports Quality (0-100) as a linear map of RSSI -100..-50 dBm,
; so RSSI = Quality/2 - 100.
[MeasureRSSI]
Measure=Calc
Formula=(MeasureQuality / 2) - 100
UpdateDivider=1

; Log-distance path loss model:
;   d = 10 ^ ((TxAt1m - RSSI) / (10 * n))
; Written with Exp/Ln since 10^x = Exp(Ln(10) * x). Clamped to 0.5 .. MaxDist.
[MeasureDistance]
Measure=Calc
Formula=Clamp(Exp(2.302585 * (#TxAt1m# - MeasureRSSI) / (10 * #PathLoss#)), 0.5, #MaxDist#)
UpdateDivider=1

[MeasureNetIn]
Measure=NetIn
Interface=Best

[MeasureNetOut]
Measure=NetOut
Interface=Best

;=====================================================
;  Panel (chamfered HUD frame, dividers, corner brackets)
;=====================================================
[Panel]
Meter=Shape
X=#Margin#
Y=#Margin#
Shape=Path PanelPath | StrokeWidth 1 | Stroke Color #NeonCyan# | Fill Color #BgClr#
PanelPath=11.9,0 | LineTo 260.1,0 | LineTo 272,11.9 | LineTo 272,314.5 | LineTo 260.1,326.4 | LineTo 11.9,326.4 | LineTo 0,314.5 | LineTo 0,11.9 | ClosePath 1
Shape2=Line 11.9,54.4,260.1,54.4 | StrokeColor #NeonCyanDim# | StrokeWidth 1
Shape3=Line 11.9,105.4,260.1,105.4 | StrokeColor #NeonCyanDim# | StrokeWidth 1
Shape4=Line 11.9,154.7,260.1,154.7 | StrokeColor #NeonCyanDim# | StrokeWidth 1
Shape5=Line 11.9,237.2,260.1,237.2 | StrokeColor #NeonCyanDim# | StrokeWidth 1
Shape6=Path CornerTL | StrokeWidth 1.7 | Stroke Color #NeonCyan#
CornerTL=5.1,18.7 | LineTo 5.1,5.1 | LineTo 18.7,5.1
Shape7=Path CornerTR | StrokeWidth 1.7 | Stroke Color #NeonCyan#
CornerTR=253.3,5.1 | LineTo 266.9,5.1 | LineTo 266.9,18.7
Shape8=Path CornerBL | StrokeWidth 1.7 | Stroke Color #NeonCyan#
CornerBL=5.1,307.7 | LineTo 5.1,321.3 | LineTo 18.7,321.3
Shape9=Path CornerBR | StrokeWidth 1.7 | Stroke Color #NeonCyan#
CornerBR=253.3,321.3 | LineTo 266.9,321.3 | LineTo 266.9,307.7

;=====================================================
;  Header
;=====================================================
[Title]
Meter=String
MeasureName=MeasureSSID
X=32.3
Y=27.2
FontFace=#FontFace#
FontSize=11
FontColor=#NeonCyan#
StringStyle=Bold
AntiAlias=1
Text="// NETWORK_HUD"

[SSIDLabel]
Meter=String
MeasureName=MeasureSSID
X=32.3
Y=45.9
FontFace=#FontFace#
FontSize=8
FontColor=#DimTextClr#
AntiAlias=1
Text="SSID: %1"

