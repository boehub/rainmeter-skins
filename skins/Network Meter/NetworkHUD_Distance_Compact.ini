MeasureName=MeasureQuality
BarOrientation=HORIZONTAL
X=32.3
Y=93.5
W=224.4
H=11.9
BarColor=#NeonCyan#
SolidColor=0,255,255,25

[SignalBarTicks]
Meter=Shape
X=32.3
Y=93.5
