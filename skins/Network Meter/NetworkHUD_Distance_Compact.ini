Shape2=Line 89.76,0,89.76,11.9 | StrokeColor #BgClr# | StrokeWidth 1.7
Shape3=Line 134.64,0,134.64,11.9 | StrokeColor #BgClr# | StrokeWidth 1.7
Shape4=Line 179.52,0,179.52,11.9 | StrokeColor #BgClr# | StrokeWidth 1.7

