[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=0,0,0,1
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Network HUD (Distance)
Author=Ryan Boe
Version=1.1
License=Creative Commons BY-NC-SA 3.0
Information=Cyberpunk-style WiFi signal + network speed HUD with an estimated distance (meters) to the connected router.

[Variables]
Margin=10
PW=320
PH=384
PadX=28

; ---- Distance model tuning ----
; TxAt1m  = expected signal (dBm) at 1 meter from the router. Typical: -40 to -45.
; PathLoss = environment exponent. ~2.0 open space, 2.5-3.5 indoors with walls.
; Calibrate: stand ~1 m from your router, note the RSSI shown, set TxAt1m to it.
TxAt1m=-40
PathLoss=3.0
MaxDist=99

; ---- Colors ----
BgClr=8,10,16,235
NeonCyan=0,255,255,255
NeonCyanDim=0,255,255,60
NeonMagenta=255,0,170,255
NeonMagentaDim=255,0,170,60
TextClr=210,255,255,255
DimTextClr=120,180,190,255
FontFace=Consolas

;=====================================================
;  Measures
;=====================================================
[MeasureSSID]
Measure=Plugin
Plugin=WifiStatus
WifiInfoType=SSID
RegExpSubstitute=1
Substitute="^-1$":"NO CONNECTION","^$":"NO CONNECTION"

[MeasureQuality]
Measure=Plugin
Plugin=WifiStatus
WifiInfoType=Quality
MinValue=0
MaxValue=100

; Windows reports Quality (0-100) as a linear map of RSSI -100..-50 dBm,
; so RSSI = Quality/2 - 100.
[MeasureRSSI]
Measure=Calc
Formula=(MeasureQuality / 2) - 100
UpdateDivider=1

; Log-distance path loss model:
;   d = 10 ^ ((TxAt1m - RSSI) / (10 * n))
; Written with Exp/Ln since 10^x = Exp(Ln(10) * x). Clamped to 0.5 .. MaxDist.
[MeasureDistance]
Measure=Calc
Formula=Clamp(Exp(2.302585 * (#TxAt1m# - MeasureRSSI) / (10 * #PathLoss#)), 0.5, #MaxDist#)
UpdateDivider=1

[MeasureNetIn]
Measure=NetIn
Interface=Best

[MeasureNetOut]
Measure=NetOut
Interface=Best

;=====================================================
;  Panel (chamfered HUD frame, dividers, corner brackets)
;=====================================================
[Panel]
Meter=Shape
X=#Margin#
Y=#Margin#
Shape=Path PanelPath | StrokeWidth 1 | Stroke Color #NeonCyan# | Fill Color #BgClr#
PanelPath=14,0 | LineTo 306,0 | LineTo 320,14 | LineTo 320,370 | LineTo 306,384 | LineTo 14,384 | LineTo 0,370 | LineTo 0,14 | ClosePath 1
Shape2=Line 14,64,306,64 | StrokeColor #NeonCyanDim# | StrokeWidth 1
Shape3=Line 14,124,306,124 | StrokeColor #NeonCyanDim# | StrokeWidth 1
Shape4=Line 14,182,306,182 | StrokeColor #NeonCyanDim# | StrokeWidth 1
Shape5=Line 14,279,306,279 | StrokeColor #NeonCyanDim# | StrokeWidth 1
Shape6=Path CornerTL | StrokeWidth 2 | Stroke Color #NeonCyan#
CornerTL=6,22 | LineTo 6,6 | LineTo 22,6
Shape7=Path CornerTR | StrokeWidth 2 | Stroke Color #NeonCyan#
CornerTR=298,6 | LineTo 314,6 | LineTo 314,22
Shape8=Path CornerBL | StrokeWidth 2 | Stroke Color #NeonCyan#
CornerBL=6,362 | LineTo 6,378 | LineTo 22,378
Shape9=Path CornerBR | StrokeWidth 2 | Stroke Color #NeonCyan#
CornerBR=298,378 | LineTo 314,378 | LineTo 314,362

;=====================================================
;  Header
;=====================================================
[Title]
Meter=String
MeasureName=MeasureSSID
X=38
Y=32
FontFace=#FontFace#
FontSize=13
FontColor=#NeonCyan#
StringStyle=Bold
AntiAlias=1
Text="// NETWORK_HUD"

[SSIDLabel]
Meter=String
MeasureName=MeasureSSID
X=38
Y=54
FontFace=#FontFace#
FontSize=9
FontColor=#DimTextClr#
AntiAlias=1
Text="SSID: %1"

;=====================================================
;  WiFi Signal
;=====================================================
[SignalLabel]
Meter=String
MeasureName=MeasureQuality
X=38
Y=88
FontFace=#FontFace#
FontSize=10
FontColor=#TextClr#
AntiAlias=1
NumOfDecimals=0
Text="SIGNAL   %1%"

[SignalBarTrack]
Meter=Bar
MeasureName=MeasureQuality
BarOrientation=HORIZONTAL
X=38
Y=110
W=264
H=14
BarColor=#NeonCyan#
SolidColor=0,255,255,25

[SignalBarTicks]
Meter=Shape
X=38
Y=110
Shape=Line 52.8,0,52.8,14 | StrokeColor #BgClr# | StrokeWidth 2
Shape2=Line 105.6,0,105.6,14 | StrokeColor #BgClr# | StrokeWidth 2
Shape3=Line 158.4,0,158.4,14 | StrokeColor #BgClr# | StrokeWidth 2
Shape4=Line 211.2,0,211.2,14 | StrokeColor #BgClr# | StrokeWidth 2

;=====================================================
;  Distance to router (estimate)
;=====================================================
[DistanceLabel]
Meter=String
MeasureName=MeasureDistance
X=38
Y=140
FontFace=#FontFace#
FontSize=10
FontColor=#NeonMagenta#
AntiAlias=1
NumOfDecimals=1
Text="RANGE    ~%1 m"

[RSSILabel]
Meter=String
MeasureName=MeasureRSSI
X=38
Y=160
FontFace=#FontFace#
FontSize=8
FontColor=#DimTextClr#
AntiAlias=1
NumOfDecimals=0
Text="RSSI %1 dBm  (est.)"

;=====================================================
;  Download
;=====================================================
[DownLabel]
Meter=String
MeasureName=MeasureNetIn
X=38
Y=206
FontFace=#FontFace#
FontSize=10
FontColor=#NeonCyan#
AntiAlias=1
AutoScale=1
Text="▼ DOWN   %1B/s"

[DownGraph]
Meter=Line
MeasureName=MeasureNetIn
X=38
Y=226
W=264
H=45
LineColor=#NeonCyan#
LineWidth=2
AutoScale=1
AntiAlias=1

;=====================================================
;  Upload
;=====================================================
[UpLabel]
Meter=String
MeasureName=MeasureNetOut
X=38
Y=303
FontFace=#FontFace#
FontSize=10
FontColor=#NeonMagenta#
AntiAlias=1
AutoScale=1
Text="▲ UP   %1B/s"

[UpGraph]
Meter=Line
MeasureName=MeasureNetOut
X=38
Y=323
W=264
H=45
LineColor=#NeonMagenta#
LineWidth=2
AutoScale=1
AntiAlias=1
