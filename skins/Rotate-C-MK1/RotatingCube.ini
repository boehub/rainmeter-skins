;===================================================================
; RotatingCube - Rainmeter Skin
; A small wireframe cube that continuously rotates, drawn live using
; Rainmeter's built-in Lua scripting + Shape meter. No plugins, no
; other software required - just Rainmeter itself.
;
; Tweak the cube's size, speed, position, and color using the
; variables at the top of cube.lua and in [Variables] below.
;===================================================================

[Rainmeter]
Update=33
DynamicWindowSize=1
AccurateText=1

[Metadata]
Name=RotatingCube
Author=Ryan Boe
Version=1.0
Description=A small rotating wireframe cube, drawn with Lua + Shape meter

[Variables]
BGColor=20,20,20,190
EdgeColor=120,200,255,255
EdgeWidth=2

;===================== MEASURE =====================

[MeasureCube]
Measure=Script
ScriptFile=cube.lua

;===================== METERS =====================

[Background]
Meter=Image
X=0
Y=0
W=140
H=140
SolidColor=#BGColor#

; 12 edges of the cube, each referencing live vertex positions from
; the Lua script via [&MeasureCube:GetX(n)] / [&MeasureCube:GetY(n)]
[CubeEdges]
Meter=Shape
; bottom face: 1-2, 2-3, 3-4, 4-1
Shape=Line [&MeasureCube:GetX(1)],[&MeasureCube:GetY(1)],[&MeasureCube:GetX(2)],[&MeasureCube:GetY(2)] | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
Shape2=Line [&MeasureCube:GetX(2)],[&MeasureCube:GetY(2)],[&MeasureCube:GetX(3)],[&MeasureCube:GetY(3)] | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
Shape3=Line [&MeasureCube:GetX(3)],[&MeasureCube:GetY(3)],[&MeasureCube:GetX(4)],[&MeasureCube:GetY(4)] | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
Shape4=Line [&MeasureCube:GetX(4)],[&MeasureCube:GetY(4)],[&MeasureCube:GetX(1)],[&MeasureCube:GetY(1)] | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
; top face: 5-6, 6-7, 7-8, 8-5
Shape5=Line [&MeasureCube:GetX(5)],[&MeasureCube:GetY(5)],[&MeasureCube:GetX(6)],[&MeasureCube:GetY(6)] | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
Shape6=Line [&MeasureCube:GetX(6)],[&MeasureCube:GetY(6)],[&MeasureCube:GetX(7)],[&MeasureCube:GetY(7)] | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
Shape7=Line [&MeasureCube:GetX(7)],[&MeasureCube:GetY(7)],[&MeasureCube:GetX(8)],[&MeasureCube:GetY(8)] | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
Shape8=Line [&MeasureCube:GetX(8)],[&MeasureCube:GetY(8)],[&MeasureCube:GetX(5)],[&MeasureCube:GetY(5)] | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
; vertical edges connecting top/bottom: 1-5, 2-6, 3-7, 4-8
Shape9=Line [&MeasureCube:GetX(1)],[&MeasureCube:GetY(1)],[&MeasureCube:GetX(5)],[&MeasureCube:GetY(5)] | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
Shape10=Line [&MeasureCube:GetX(2)],[&MeasureCube:GetY(2)],[&MeasureCube:GetX(6)],[&MeasureCube:GetY(6)] | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
Shape11=Line [&MeasureCube:GetX(3)],[&MeasureCube:GetY(3)],[&MeasureCube:GetX(7)],[&MeasureCube:GetY(7)] | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
Shape12=Line [&MeasureCube:GetX(4)],[&MeasureCube:GetY(4)],[&MeasureCube:GetX(8)],[&MeasureCube:GetY(8)] | StrokeColor #EdgeColor# | StrokeWidth #EdgeWidth#
DynamicVariables=1
X=0
Y=0
